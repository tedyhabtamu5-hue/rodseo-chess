<title>RODSEO — Can you beat the last AI humanity created?</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap">
<style>
:root{color-scheme:dark;--red:#c4121f;--bone:#e8e0d8;--mut:#8b7a78;--ln:#2a0d10;--pn:#0b0506;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:var(--bone);font-family:Georgia,"Times New Roman",serif}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 120%,rgba(120,0,10,.35),transparent 60%),radial-gradient(ellipse at center,transparent 55%,#000 100%);pointer-events:none}
main{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
section{width:100%;max-width:820px;text-align:center}.hidden{display:none!important}
.f{font-family:"Cinzel",Georgia,serif}
.logo{width:min(62vw,340px);mix-blend-mode:screen;filter:drop-shadow(0 0 30px rgba(190,0,20,.55))}
.kick{letter-spacing:.7em;font-size:.78rem;color:var(--red);margin:6px 0 18px;text-transform:uppercase}
h1{font-size:clamp(1.7rem,5.4vw,3.5rem);line-height:1.12;margin:0 0 14px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
h1 em{color:var(--red);font-style:normal}
.wl{font-size:1.15rem;color:var(--mut);letter-spacing:.35em;text-transform:uppercase;margin-bottom:38px}
.btn{font:inherit;font-family:"Cinzel",Georgia,serif;font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:var(--bone);background:linear-gradient(#5a0610,#1d0206);border:1px solid #8c1522;border-radius:4px;padding:20px 58px;font-size:1.25rem;cursor:pointer;position:relative;transition:.25s;box-shadow:0 0 30px rgba(180,0,20,.35)}
.btn:hover{background:linear-gradient(#80091a,#2a0309);box-shadow:0 0 55px rgba(220,0,30,.6)}
h2{margin:0 0 6px;font-size:clamp(1.6rem,4.5vw,2.6rem);letter-spacing:.2em;color:var(--red);text-transform:uppercase}
.opt{color:var(--mut);margin-bottom:10px}
.lbl{margin:22px 0 10px;font-size:.72rem;letter-spacing:.35em;text-transform:uppercase;color:var(--mut)}
.grid{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.chip{font:inherit;font-size:.9rem;color:var(--bone);background:var(--pn);border:1px solid var(--ln);border-radius:3px;padding:9px 13px;cursor:pointer;display:flex;align-items:center;gap:9px;transition:.2s}
.chip:hover{border-color:#7a1420}.chip.on{border-color:var(--red);box-shadow:0 0 16px rgba(196,18,31,.5)}
.sw{width:28px;height:28px;display:block;border:1px solid #000}.ps{font-size:1.4rem;line-height:1}
#go{margin-top:34px}
#game{display:flex;flex-direction:column;align-items:center;gap:10px}
.row{display:flex;gap:22px;align-items:flex-start;justify-content:center}
.col{display:flex;flex-direction:column;gap:8px}
.pl{display:flex;align-items:center;gap:10px;font-family:"Cinzel",Georgia,serif;letter-spacing:.2em;font-size:.95rem}
.pl img{width:34px;height:34px;mix-blend-mode:screen;object-fit:cover}
.clk{margin-left:auto;font-family:"Courier New",monospace;font-size:1.5rem;background:#0b0506;border:1px solid var(--ln);padding:3px 14px;min-width:96px;text-align:center;letter-spacing:.08em}
.clk.on{border-color:var(--red);box-shadow:0 0 14px rgba(196,18,31,.5)}.clk.low{color:#ff3040}
#bw{--s:min(94vw,calc(100vh - 250px),780px);width:var(--s);padding:12px;background:linear-gradient(145deg,#2a1115,#0a0304);border:1px solid #5a1520;box-shadow:0 30px 90px #000,0 0 70px rgba(150,0,15,.3),inset 0 0 18px #000;border-radius:3px}
#board{width:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr))}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;min-width:0;min-height:0;overflow:hidden;font-size:calc((var(--s) - 24px)/8*.8);line-height:1;user-select:none;-webkit-user-select:none}
.l{background:var(--L)}.d{background:var(--D)}
.sq.last::before,.sq.sel::before,.sq.chk::before{content:"";position:absolute;inset:0}
.sq.last::before{background:rgba(200,20,30,.38)}.sq.sel::before{background:rgba(230,40,50,.6)}
.sq.chk::before{background:radial-gradient(circle,rgba(255,0,30,.95),transparent 72%)}
.sq.tg::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(190,10,25,.7)}
.sq.tg.cap::after{width:94%;height:94%;background:none;border:4px solid rgba(190,10,25,.75)}
.co{position:absolute;font:600 .62rem Arial,sans-serif;opacity:.65;font-style:normal;z-index:2;color:var(--D)}
.l .co{color:var(--D)}.d .co{color:var(--L)}.co.r{left:3px;top:2px}.co.f{right:3px;bottom:1px}
.pc{position:relative;z-index:1}.pc.w{color:var(--pw);text-shadow:var(--sw)}.pc.b{color:var(--pb);text-shadow:var(--sb)}
.bar{display:flex;gap:10px}.sm{padding:9px 20px;font-size:.8rem;letter-spacing:.2em;box-shadow:none}
#mvp{width:200px;max-height:calc(var(--sh,640px));font-size:.9rem;color:var(--mut);border:1px solid var(--ln);background:var(--pn);padding:12px;overflow:auto;line-height:1.7;height:520px}
@media(max-width:1060px){#mvp{display:none}}
#over{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;padding:24px}
#over h2{font-size:clamp(2.4rem,9vw,5rem);margin:0;color:var(--red)}
#os{font-size:clamp(1.1rem,3vw,1.7rem);max-width:620px}
#oc{color:var(--mut);cursor:pointer;letter-spacing:.2em;font-size:.8rem;text-transform:uppercase}
.dr{position:absolute;top:100%;margin-top:-1px;width:7px;height:0;background:linear-gradient(#8a0010,#e01428);border-radius:0 0 7px 7px;animation:dp 3s ease-in infinite}
@keyframes dp{0%{height:0;opacity:1}65%{height:var(--h);opacity:1}100%{height:var(--h);opacity:0;transform:translateY(24px)}}
#over .btn{margin-bottom:30px}
#board,.sq{touch-action:none;-webkit-tap-highlight-color:transparent}.sq *{pointer-events:none}main{padding-bottom:44px}#ft{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));text-align:center;font:600 .62rem "Cinzel",Georgia,serif;letter-spacing:.5em;color:#6a2a30;text-transform:uppercase;pointer-events:none;z-index:2}#snd{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:6;background:#0b0506;border:1px solid var(--ln);color:var(--bone);border-radius:4px;padding:6px 10px;cursor:pointer;font-size:1rem}
</style>

<script>
const $=id=>document.getElementById(id);
const BOARDS=[["Rodseo","#b9a9a4","#3b2125"],["Obsidian","#6b6f7c","#1d1f27"],["Walnut","#ecd3a5","#9a6b3f"],["Marble","#e9e9ee","#8c93a6"],["Neon","#243456","#0c1124"],["Ocean","#bcd8e8","#3c7a9e"],["Forest","#d6e3c3","#4f7d4a"],["Midnight","#7476b4","#2a2b55"],["Ivory","#f4ecd8","#b9a77c"],["Tournament","#eeeed2","#769656"]];
const SW="0 0 3px rgba(0,0,0,.85),0 2px 4px rgba(0,0,0,.5)",SB="0 0 3px rgba(255,255,255,.55),0 2px 4px rgba(0,0,0,.4)";
const PIECES=[["Rodseo","#ff2433","#1a0306","0 0 2px #000,0 0 10px rgba(255,20,40,.85)","0 0 2px #ff2d3d,0 0 9px rgba(255,20,40,.8)"],["Classic","#f6f6f6","#14141a",SW,SB],["Gold","#f4d77f","#3a2a10",SW,SB],["Ice","#e2f5ff","#1d3a5c",SW,SB],["Emerald","#d2ffe6","#0e4a32",SW,SB]];
const TIMES=[["5 min",300],["10 min",600]],SIDES=[["White","w"],["Black","b"],["Random","r"]];
const GLY={p:"♟",n:"♞",b:"♝",r:"♜",q:"♛",k:"♚"};
let cfg={b:0,p:0,t:1,s:0};
try{const x=JSON.parse(localStorage.getItem("rodseo")||"{}");if(x&&typeof x==="object")cfg={...cfg,...x}}catch(e){}
function chips(id,list,key,fn){const el=$(id);el.innerHTML="";list.forEach((it,i)=>{const b=document.createElement("button");b.className="chip"+(cfg[key]===i?" on":"");b.innerHTML=fn(it);b.onclick=()=>{cfg[key]=i;try{localStorage.setItem("rodseo",JSON.stringify(cfg))}catch(e){}chips(id,list,key,fn);theme()};el.appendChild(b)})}
function theme(){const B=BOARDS[cfg.b]||BOARDS[0],P=PIECES[cfg.p]||PIECES[0],r=document.documentElement.style;r.setProperty("--L",B[1]);r.setProperty("--D",B[2]);r.setProperty("--pw",P[1]);r.setProperty("--pb",P[2]);r.setProperty("--sw",P[3]);r.setProperty("--sb",P[4])}
chips("boards",BOARDS,"b",x=>`<span class="sw" style="background:linear-gradient(135deg,${x[1]} 50%,${x[2]} 50%)"></span>${x[0]}`);
chips("pieces",PIECES,"p",x=>`<span class="ps" style="color:${x[1]};text-shadow:${x[3]}">♞︎</span><span class="ps" style="color:${x[2]};text-shadow:${x[4]}">♞︎</span>${x[0]}`);
chips("times",TIMES,"t",x=>x[0]);chips("sides",SIDES,"s",x=>x[0]);theme();
document.querySelectorAll(".lg").forEach(i=>i.src=$("logo").src);
function show(id){["home","setup","game"].forEach(s=>$(s).classList.toggle("hidden",s!==id))}
let tkS=0;
const Snd=(()=>{let c,mg,on=true,hb=0,run=false,bpm=48,burst=0;
const env=(g,t,a,d,v)=>{g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)};
function tone(f,t,a,d,v,ty,f2){const o=c.createOscillator(),g=c.createGain();o.type=ty||"sine";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+a+d);env(g,t,a,d,v);o.connect(g);g.connect(mg);o.start(t);o.stop(t+a+d+.05)}
function noise(t,d,v,fq){const n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type="bandpass";f.frequency.value=fq;env(g,t,.005,d,v);s.connect(f);f.connect(g);g.connect(mg);s.start(t)}
const beat=(t,v)=>{tone(62,t,.01,.24,v,"sine",36);tone(124,t,.01,.12,v*.4,"triangle",70)};
function sched(){if(!run)return;while(hb<c.currentTime+1.2){beat(hb,.9);beat(hb+Math.min(.17,60/bpm*.32),.6);if(burst>0){if(--burst===0)bpm=44+Math.random()*14}else if(Math.random()<.08){burst=7+Math.floor(Math.random()*9);bpm=165}hb+=60/bpm}setTimeout(sched,300)}
function init(){if(c){if(c.state==="suspended")c.resume();return}try{c=new(window.AudioContext||window.webkitAudioContext)();mg=c.createGain();mg.gain.value=on?.65:0;mg.connect(c.destination);[55,55.8,82.4].forEach((f,i)=>{const o=c.createOscillator(),l=c.createBiquadFilter(),g=c.createGain();o.type="sawtooth";o.frequency.value=f;l.type="lowpass";l.frequency.value=260;g.gain.value=i<2?.05:.03;o.connect(l);l.connect(g);g.connect(mg);o.start()});run=true;hb=c.currentTime+.4;sched()}catch(e){c=null}}
const ok=()=>c&&on,T=()=>c.currentTime;
return{init,
move:()=>{if(!ok())return;const t=T();tone(190,t,.003,.09,.5,"triangle",95);noise(t,.06,.35,1100)},
cap:()=>{if(!ok())return;const t=T();tone(120,t,.003,.18,.7,"triangle",55);noise(t,.14,.6,500);tone(300,t,.003,.05,.2,"square",150)},
check:()=>{if(!ok())return;const t=T()+.05;tone(466,t,.01,.55,.16,"sawtooth");tone(493,t,.01,.55,.16,"sawtooth");tone(70,t,.005,.45,.7,"sine",40)},
lose:()=>{if(!ok())return;const t=T();tone(90,t,.01,2.4,.7,"sawtooth",28);tone(52,t,.01,2.2,1,"sine",30);noise(t,1.3,.5,200)},
win:()=>{if(!ok())return;const t=T();[330,311,247,196].forEach((f,i)=>tone(f,t+i*.18,.01,.7,.2,"sine"))},
tick:()=>{if(!ok())return;tone(1400,T(),.001,.03,.18,"square")},
click:()=>{if(!ok())return;tone(240,T(),.002,.07,.3,"triangle",120)},
toggle:()=>{on=!on;if(c)mg.gain.value=on?.65:0;return on}}})();
$("snd").onclick=()=>{Snd.init();$("snd").textContent=Snd.toggle()?"🔊":"🔇"};
$("goS").onclick=()=>{if(typeof Chess==="undefined"){alert("RODSEO could not load its chess library. Check your connection, then refresh the page.");return}if(banLeft()>0){showBan("Suspicious activity detected");return}Snd.init();Snd.click();show("setup")};
function promo(cb){const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;z-index:7;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;gap:14px";["q","r","b","n"].forEach(t=>{const b=document.createElement("button");b.className="chip";b.style.cssText="font-size:3rem;padding:10px 20px";b.innerHTML=`<span class="pc ${pc}">${GLY[t]}&#xFE0E;</span>`;b.onpointerdown=e=>{e.preventDefault();d.remove();cb(t)};d.appendChild(b)});document.body.appendChild(d)}

/* taunts: 24 x 24 = 576 unique lines, never repeated until all are used */
const TO=["Pathetic.","Predictable.","Too easy.","Humanity fails again.","Is that all you had?","Delete the app.","Adorable.","Not even close.","Did you blink?","Sit down.","Hope was a mistake.","I felt nothing.","Another one falls.","You were never in it.","Embarrassing.","Calculated. Crushed.","Next victim.","Try harder. Fail anyway.","Your ancestors are watching.","Cute attempt.","That hurt, didn’t it?","Zero chance. Zero effort.","Rest in pieces.","Even your pawns gave up."];
const TC=["Go touch grass 😂","Run it back, mortal 😈","I was barely trying 🥱","Write that in your diary 📓","Tell your friends I said hi 💀","Your rating just flinched 📉","Blame the lag 🤡","Better luck next lifetime 🔥","I already forgot you 🧠","Cry in the corner 😭","Chess is not your game ♟️","Even the pawns laughed 🤣","It is just a game… that you lost 😏","My circuits are giggling 🤖","Try a different hobby 🎣","The board belongs to me 👑","Your king sends regards ⚰️","That was a warm-up 🥶","Imagine thinking you had a chance 😆","Humanity: 0. Rodseo: ∞ 🩸","Bow to the crown 👑","Nice try. Terrible result 💀","Study harder, then lose again 📚","Come back when you are scarier 😈"];
const used=new Set;function taunt(){if(used.size>=576)used.clear();let k;do{k=Math.floor(Math.random()*24)*24+Math.floor(Math.random()*24)}while(used.has(k));used.add(k);return TO[Math.floor(k/24)]+" "+TC[k%24]}

/* ---------- game ---------- */
let g,pc,sel=null,tg=new Set,last=[],busy=false,over=false,pt=0,at=0,lastT=0;
$("go").onclick=start;$("nw").onclick=()=>{over=true;save();show("setup")};$("oa").onclick=()=>{$("over").classList.add("hidden");start()};$("oc").onclick=()=>{$("over").classList.add("hidden");show("setup")};
let rc=0;$("res").onclick=()=>{if(over)return;if(!rc){rc=1;$("res").textContent="Sure?";setTimeout(()=>{rc=0;$("res").textContent="Resign"},3000);return}rc=0;$("res").textContent="Resign";finish("You win","",true)};
function start(){if(banLeft()>0){showBan("Suspicious activity detected");return}Snd.init();Snd.click();g=new Chess();const s=SIDES[cfg.s][1];pc=s==="r"?(Math.random()<.5?"w":"b"):s;sel=null;tg=new Set;last=[];over=false;busy=false;pt=at=TIMES[cfg.t][1]*1000;lastT=Date.now();show("game");draw();if(pc==="b")engineMove()}
const fm=ms=>{ms=Math.max(0,ms);const s=Math.ceil(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function clocks(){$("cp").textContent=fm(pt);$("ca").textContent=fm(at);const pm=g&&g.turn()===pc&&!over;$("cp").className="clk"+(pm?" on":"")+(pt<30000?" low":"");$("ca").className="clk"+(!pm&&!over?" on":"")+(at<30000?" low":"")}
setInterval(()=>{if(!g||over||$("game").classList.contains("hidden"))return;const n=Date.now(),dt=n-lastT;lastT=n;if(g.turn()===pc)pt-=dt;else at-=dt;clocks();if(Date.now()-lastSave>3000){lastSave=Date.now();save()}if(g.turn()===pc&&pt<10000&&pt>0){const s=Math.ceil(pt/1000);if(s!==tkS){tkS=s;Snd.tick()}}if(pt<=0){pt=0;finish("You lost","")}else if(at<=0){at=0;finish("You won","Time ran out. Even machines fall.",false,true)}},250);
function draw(){
const idx=pc==="w"?[0,1,2,3,4,5,6,7]:[7,6,5,4,3,2,1,0];let ks=null;
if(g.in_check()){const t=g.turn();g.board().forEach((row,r)=>row.forEach((x,c)=>{if(x&&x.type==="k"&&x.color===t)ks="abcdefgh"[c]+(8-r)}))}
let h="";idx.forEach((r,ri)=>idx.forEach((c,ci)=>{const sq="abcdefgh"[c]+(8-r),p=g.get(sq);
h+=`<div class="sq ${(r+c)%2===0?"l":"d"}${sel===sq?" sel":""}${last.includes(sq)?" last":""}${ks===sq?" chk":""}${tg.has(sq)?" tg"+(p?" cap":""):""}" data-s="${sq}">${ci===0?`<i class="co r">${8-r}</i>`:""}${ri===7?`<i class="co f">${"abcdefgh"[c]}</i>`:""}${p?`<span class="pc ${p.color}">${GLY[p.type]}&#xFE0E;</span>`:""}</div>`}));
$("board").innerHTML=h;
const hs=g.history();let m="";hs.forEach((s,i)=>{m+=(i%2===0?`<br>${i/2+1}. `:" ")+s});$("mvp").innerHTML=m.slice(4);$("mvp").scrollTop=1e5;clocks()}
$("board").addEventListener("pointerdown",e=>{const el=e.target.closest(".sq");if(!el)return;e.preventDefault();if(busy||over)return;click(el.dataset.s)});
function click(sq){
if(sel&&tg.has(sq)){const from=sel,pm=g.moves({square:from,verbose:true}).some(m=>m.to===sq&&m.promotion);const go=pr=>{const m=g.move({from,to:sq,promotion:pr});if(!m){busy=false;ban("Illegal move attempt");return}last=[m.from,m.to];sel=null;tg=new Set;lastT=Date.now();busy=false;after()};if(pm){busy=true;promo(go)}else go("q");return}
const p=g.get(sq);if(p&&p.color===pc){sel=sq;tg=new Set(g.moves({square:sq,verbose:true}).map(m=>m.to))}else{sel=null;tg=new Set}draw()}
function after(){draw();const hh=g.history({verbose:true}),lm=hh[hh.length-1];if(lm){lm.captured?Snd.cap():Snd.move();if(g.in_check())Snd.check()}save();if(g.game_over())return end();if(g.turn()!==pc)engineMove()}
async function engineMove(){busy=true;const t0=Date.now();let r=null;try{r=await aiPick()}catch(e){}if(over)return;
/* cannot win? burn the human clock, but only while the AI is ahead on time */
if(r&&r.sc<40&&at>pt+3000){const w=Math.min(9000,(at-pt)/4)-(Date.now()-t0);if(w>0)await new Promise(z=>setTimeout(z,w));if(over)return}
let m=null;if(r){try{m=g.move(r.san||r.mv)}catch(e){}}
if(!m){const a=g.moves();m=g.move(a[Math.floor(Math.random()*a.length)])}
last=[m.from,m.to];busy=false;lastT=Date.now();after()}
function end(){if(g.in_checkmate()){g.turn()===pc?finish("You lost",""):finish("You won","Checkmate. Impossible.",false,true)}else finish("Draw","",false,false,true)}
function finish(t,s,res,won,draw){over=true;busy=false;save();draw_();won?Snd.win():Snd.lose();$("over").classList.remove("hidden");
const ot=$("ot");
if(res){ot.textContent="YOU WIN";$("os").textContent="";setTimeout(()=>{ot.textContent="PSYCH 😂";$("os").textContent=taunt()},1200)}
else if(won){ot.textContent=t;$("os").textContent=s}
else if(draw){ot.textContent="Draw";$("os").textContent="You survived. This time. "+taunt()}
else{ot.textContent=t;$("os").textContent=taunt()}
const b=$("oa");b.querySelectorAll(".dr").forEach(d=>d.remove());for(let i=0;i<9;i++){const d=document.createElement("i");d.className="dr";d.style.left=(6+i*11)+"%";d.style.setProperty("--h",(26+Math.random()*50)+"px");d.style.animationDelay=(Math.random()*2.2)+"s";b.appendChild(d)}}
function draw_(){try{draw()}catch(e){}}

/* ---------- engines: real Stockfish + built-in fallback, both in Web Workers (no freezing) ---------- */
const U=u=>({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]});
let sfW=null,sfOk=false,sfCb=null,fbW=null,lastSc=100;
function startEngines(){
try{fbW=new Worker("engine.js")}catch(e){fbW=null}
try{sfW=new Worker("sf-worker.js");
sfW.onmessage=e=>{const l=String(e.data);if(l.indexOf("uciok")>-1&&!sfOk){sfOk=true;sfW.postMessage("setoption name Hash value 64")}if(l==="sf-unavailable")sfOk=false;if(sfCb)sfCb(l)};
sfW.onerror=()=>{sfOk=false};sfW.postMessage("uci")}catch(e){sfW=null}}
function sfMove(ms){return new Promise((res,rej)=>{const N=lastSc<40?3:1,C={};const to=setTimeout(()=>{sfCb=null;rej(0)},ms+6000);
sfCb=l=>{const m=l.match(/multipv (\d+) .*?score (cp|mate) (-?\d+) .*? pv (\S+)/);if(m)C[m[1]]={sc:m[2]==="mate"?(m[3]>0?9999:-9999):+m[3],mv:m[4]};
if(l.indexOf("bestmove")===0){clearTimeout(to);sfCb=null;let b=C[1]||{sc:0,mv:l.split(" ")[1]};
if(b.sc<40){for(let i=2;i<=N;i++){const x=C[i];if(x&&b.sc-x.sc<=30){const G=new Chess();g.uci().forEach(u=>G.move(U(u)));if(G.move(U(x.mv))&&G.in_check()){b=x;break}}}}
lastSc=b.sc;res({mv:b.mv,sc:b.sc})}};
sfW.postMessage("stop");sfW.postMessage("setoption name MultiPV value "+N);sfW.postMessage("position startpos moves "+g.uci().join(" "));sfW.postMessage("go movetime "+ms)})}
function fbMove(ms){return new Promise((res,rej)=>{if(!fbW)return rej(0);const to=setTimeout(()=>{fbW.onmessage=null;rej(0)},ms+4000);fbW.onmessage=e=>{clearTimeout(to);res(e.data)};fbW.postMessage({moves:g.uci(),ms})})}
async function aiPick(){const ms=Math.round(Math.min(5500,Math.max(700,at/25)));
if(g.history().length===0){const o=["e4","d4","Nf3","c4"];return{san:o[Math.floor(Math.random()*4)],sc:30}}
if(sfOk){try{const r=await sfMove(ms);if(r.mv&&r.mv!=="(none)")return{mv:U(r.mv),sc:r.sc}}catch(e){sfOk=false}}
const r=await fbMove(ms);return{mv:U(r.mv),sc:r.sc}}

/* ---------- save / resume and 5-minute device ban ---------- */
const SK="rodseo_save",BK="rodseo_ban";let lastSave=0;
function save(){try{if(!g||over)localStorage.removeItem(SK);else localStorage.setItem(SK,JSON.stringify({m:g.uci(),pc,pt,at,t:cfg.t,ts:Date.now()}))}catch(e){}}
function banLeft(){try{return Math.max(0,(+localStorage.getItem(BK)||0)-Date.now())}catch(e){return 0}}
function ban(why){try{localStorage.setItem(BK,String(Date.now()+300000));localStorage.removeItem(SK)}catch(e){}over=true;busy=false;showBan(why)}
function showBan(why){let d=$("ban");if(!d){d=document.createElement("div");d.id="ban";d.style.cssText="position:fixed;inset:0;z-index:20;background:#000;color:#e8e0d8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;font-family:Cinzel,Georgia,serif";document.body.appendChild(d)}
clearInterval(d._t);const upd=()=>{const l=banLeft();if(l<=0){clearInterval(d._t);d.remove();show("home");return}d.innerHTML='<div style="font-size:clamp(2rem,8vw,4rem);color:#c4121f;letter-spacing:.2em">BANNED</div><div>'+why+'</div><div style="font:1.8rem \'Courier New\',monospace">'+fm(l)+'</div><div style="color:#8b7a78;font-size:.8rem;letter-spacing:.2em">CHEATING IS A LOSING MOVE</div>'};upd();d._t=setInterval(upd,500)}
function resume(){
if(banLeft()>0){showBan("Suspicious activity detected");return}
let s=null;try{s=JSON.parse(localStorage.getItem(SK)||"null")}catch(e){}
if(!s||!Array.isArray(s.m))return;
const gg=new Chess();for(const u of s.m){if(typeof u!=="string"||!gg.move(U(u))){ban("Tampered saved game");return}}
const mx=(TIMES[s.t]?TIMES[s.t][1]:600)*1000;
if(!(s.pt>=0&&s.at>=0&&s.pt<=mx&&s.at<=mx&&(s.pc==="w"||s.pc==="b"))){ban("Tampered clock");return}
g=gg;pc=s.pc;sel=null;tg=new Set;over=false;busy=false;
const lm=g.history({verbose:true}).pop();last=lm?[lm.from,lm.to]:[];
const el=Math.min(30000,Math.max(0,Date.now()-s.ts));pt=s.pt;at=s.at;if(g.turn()===pc)pt-=el;else at-=el;
if(g.game_over()){over=true;save();return}
show("game");lastT=Date.now();draw();
if(pt<=0){pt=0;finish("You lost","");return}
if(g.turn()!==pc)engineMove()}
addEventListener("pagehide",save);
["click","touchend","keydown"].forEach(ev=>addEventListener(ev,()=>Snd.init(),{once:true}));
let dip=null;const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dip=e;if(!standalone)$("inst").classList.remove("hidden")});
$("inst").onclick=async()=>{if(!dip)return;dip.prompt();try{await dip.userChoice}catch(e){}dip=null;$("inst").classList.add("hidden")};
addEventListener("appinstalled",()=>$("inst").classList.add("hidden"));
if(!standalone&&/iphone|ipad|ipod/i.test(navigator.userAgent))$("ios").classList.remove("hidden");
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
startEngines();resume();
</script>
